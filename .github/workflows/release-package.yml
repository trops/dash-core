name: Publish Package

on:
    push:
        branches:
            - "master"

jobs:
    publish-npm:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22.22.1
                  registry-url: https://registry.npmjs.org/
            - run: npm ci
            # Secret is injected into dist/mcp/servers/google-drive.js by
            # scripts/inject-secrets.js, which the build:electron step
            # runs. Without this env var the published package contains
            # the literal placeholder "__GDRIVE_CLIENT_SECRET__" and the
            # Google OAuth flow returns invalid_client at runtime.
            - run: npm run build
              env:
                  GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
            # `prepublishOnly` re-runs `npm run build`, so the secret
            # has to be available here too — otherwise the rebuild
            # wipes the injected placeholder and publishes the literal
            # "__GDRIVE_CLIENT_SECRET__" string instead of the secret.
            #
            # Auth: a Trusted Publisher (OIDC) is configured for this
            # package on npm AND a legacy `NPM_TOKEN` is wired in env.
            # The npm CLI in Node 22.22.1 (npm 10.9.4) doesn't know how
            # to use OIDC for the PUT itself — it only signs provenance
            # via OIDC and then uses NODE_AUTH_TOKEN for the publish
            # auth. So the token path is what's load-bearing here until
            # we can move to Node ≥24 / npm ≥11.5.1, at which point the
            # token line can come out. Removing the token now (with
            # npm 10.x) produces an E404 on PUT — see commit history
            # for the prior CLI-upgrade attempt that broke other things.
            - run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
