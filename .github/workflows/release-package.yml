name: Publish Package

on:
  push:
    branches:
      - "master"

# One publish at a time: two quick merges must not pick the same version.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Optional (DASH-48): only whether the token is set, not the token.
      HAS_DASH_BOT_TOKEN: ${{ secrets.DASH_BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      # Secret is injected into dist/mcp/servers/google-drive.js by
      # scripts/inject-secrets.js, which the build:electron step
      # runs. Without this env var the published package contains
      # the literal placeholder "__GDRIVE_CLIENT_SECRET__" and the
      # Google OAuth flow returns invalid_client at runtime.
      - run: npm run build
        env:
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      # `prepublishOnly` re-runs `npm run build`, so the secret
      # has to be available here too — otherwise the rebuild
      # wipes the injected placeholder and publishes the literal
      # "__GDRIVE_CLIENT_SECRET__" string instead of the secret.
      #
      # Auth: a Trusted Publisher (OIDC) is configured for this
      # package on npm AND a legacy `NPM_TOKEN` is wired in env.
      # The npm CLI in Node 22.22.1 (npm 10.9.4) doesn't know how
      # to use OIDC for the PUT itself — it only signs provenance
      # via OIDC and then uses NODE_AUTH_TOKEN for the publish
      # auth. So the token path is what's load-bearing here until
      # we can move to Node ≥24 / npm ≥11.5.1, at which point the
      # token line can come out. Removing the token now (with
      # npm 10.x) produces an E404 on PUT — see commit history
      # for the prior CLI-upgrade attempt that broke other things.
      # The version is picked here, at merge time, not in the PR: several
      # PRs (yours or the Code Factory's) can wait at once, all made from
      # the same master. package.json's version is used if it's past
      # everything on npm (you bumped it, e.g. ci.sh --pr); otherwise the
      # next patch after npm's highest. The bump stays in this runner;
      # master's package.json isn't changed (it's protected), and npm's
      # provenance records which commit each version came from.
      # npm can lag a few minutes behind a publish, so a clash with a
      # version it doesn't list yet moves on to the next one (3 tries).
      - name: Pick the version and publish
        id: publish
        shell: bash
        run: |
          taken=()
          for try in 1 2 3; do
            VERSION="$(node scripts/pickReleaseVersion.js "${taken[@]}")"
            npm version "$VERSION" --no-git-tag-version --allow-same-version > /dev/null
            echo "Publishing @trops/dash-core@$VERSION (try $try)"
            if npm publish --provenance --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Published @trops/dash-core@$VERSION from ${GITHUB_SHA::8}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            grep -qiE "previously published|EPUBLISHCONFLICT|cannot publish over" "$RUNNER_TEMP/publish.log" || exit 1
            taken+=(--taken "$VERSION")
          done
          echo "Couldn't find a free version after 3 tries." >&2
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      # DASH-48: tell dash-electron a new version is out, so its
      # bump-deps workflow opens a "take @trops/dash-core X" PR now
      # instead of on its next 15-minute check. Needs DASH_BOT_TOKEN
      # (fine-grained, Actions + Contents on trops/dash-electron);
      # skipped without it.
      - name: Tell dash-electron
        if: ${{ env.HAS_DASH_BOT_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.DASH_BOT_TOKEN }}
        run: |
          VERSION="${{ steps.publish.outputs.version }}"
          gh api repos/trops/dash-electron/dispatches \
              -f event_type=dash-core-published \
              -f "client_payload[version]=$VERSION"
